<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operador - Agenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Operador</a>
    <div class="d-flex gap-2">
      <button id="btnLogout" class="btn btn-sm btn-warning">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
    <div>
      <h2 class="mb-0">Agenda diaria</h2>
      <small class="text-muted">Confirmar y reprogramar.</small>
    </div>
    <div style="min-width: 240px;">
      <label class="form-label mb-1">Fecha</label>
      <input id="agendaDate" type="date" class="form-control">
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Fechas</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="agendaBody"></tbody>
    </table>
  </div>
</div>

<script type="module" src="./js/pages/operator.page.js"></script>
</body>
</html>
