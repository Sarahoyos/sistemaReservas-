<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cliente - Mis reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-success navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Cliente</a>
    <div class="d-flex gap-2">
      <button id="btnLogout" class="btn btn-sm btn-warning">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="mb-3">
    <div class="fw-semibold">Sesión:</div>
    <div id="userLabel" class="text-muted"></div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Crear reserva</h5>
          <form id="createReservationForm">
            <div class="mb-2">
              <label class="form-label">Check-in</label>
              <input id="checkIn" type="date" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Check-out</label>
              <input id="checkOut" type="date" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Huéspedes</label>
              <input id="guests" type="number" min="1" value="1" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Notas</label>
              <textarea id="notes" class="form-control" rows="2"></textarea>
            </div>
            <div id="msg" class="text-danger mb-2"></div>
            <button class="btn btn-success w-100" type="submit">Crear (Pendiente)</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Mi historial</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Fechas</th>
                  <th>Huéspedes</th>
                  <th>Estado</th>
                  <th>Notas</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="myReservationsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./js/pages/client.page.js"></script>
</body>
</html>
