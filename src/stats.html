<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Estadísticas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="admin.html">Admin</a>
    <div class="d-flex gap-2">
      <button id="btnLogout" class="btn btn-sm btn-warning">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2>Panel estadístico</h2>
  <div class="row g-3 my-2">
    <div class="col-6 col-lg-3">
      <div class="card"><div class="card-body">
        <div class="text-muted">Total</div><div class="fs-3" id="kpiTotal">0</div>
      </div></div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card"><div class="card-body">
        <div class="text-muted">Pendientes</div><div class="fs-3" id="kpiPending">0</div>
      </div></div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card"><div class="card-body">
        <div class="text-muted">Confirmadas</div><div class="fs-3" id="kpiConfirmed">0</div>
      </div></div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card"><div class="card-body">
        <div class="text-muted">Canceladas</div><div class="fs-3" id="kpiCancelled">0</div>
      </div></div>
    </div>
  </div>

  <div class="mt-4">
    <h5>Reservas por día (check-in)</h5>
    <div id="byDay"></div>
  </div>
</div>

<script type="module" src="./js/pages/stats.page.js"></script>
</body>
</html>
