<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 520px;">
    <h1 class="mb-3">Hotel Reservations</h1>
    <p class="text-muted">Admin: admin@hotel.com / admin123 — Operador: op@hotel.com / op123</p>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control" type="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input id="password" class="form-control" type="password" required />
          </div>
          <div id="msg" class="text-danger mb-3"></div>
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        </form>

        <hr class="my-4" />
        <a class="btn btn-outline-secondary w-100" href="register.html">Crear cuenta (Cliente)</a>
      </div>
    </div>
  </div>

    <script type="module" src="/src/js/pages/login.page.js"></script>

</body>
</html>
