<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Admin</a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-light" href="stats.html">Estadísticas</a>
      <button id="btnLogout" class="btn btn-sm btn-warning">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
    <div>
      <h2 class="mb-0">Todas las reservas</h2>
      <small class="text-muted">Cambiar estados, reprogramar, eliminar.</small>
    </div>
    <div style="min-width: 240px;">
      <label class="form-label mb-1">Filtrar por estado</label>
      <select id="filterStatus" class="form-select">
        <option value="">Todos</option>
        <option value="PENDING">Pendiente</option>
        <option value="CONFIRMED">Confirmada</option>
        <option value="CANCELLED">Cancelada</option>
      </select>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Fechas</th>
          <th>Huéspedes</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="reservationsBody"></tbody>
    </table>
  </div>
</div>

<script type="module" src="./js/pages/admin.page.js"></script>
</body>
</html>
