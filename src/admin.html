<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 520px;">
    <h1 class="mb-3">Registro Cliente</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control" type="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input id="password" class="form-control" type="password" required />
          </div>

          <div id="msg" class="text-danger mb-3"></div>

          <button class="btn btn-primary w-100" type="submit">Registrarme</button>
        </form>

        <hr class="my-4" />
        <a class="btn btn-outline-secondary w-100" href="index.html">Volver al login</a>
      </div>
    </div>
  </div>

  <script type="module" src="./js/pages/admin.page.js"></script>
</body>
</html>
